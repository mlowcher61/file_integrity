[defaults]
inventory = inventory/example.yml
# ./collections first (local installs), then the standard locations so the
# collections bundled in an execution environment (ee-supported-rhel9) are found.
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
# The project's defaults role lives next to the playbooks (always found, even
# when AAP sets ANSIBLE_ROLES_PATH); listed here for the tests/ playbooks.
roles_path = ./playbooks/roles
stdout_callback = ansible.builtin.default
result_format = yaml
callback_result_format = yaml
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
forks = 25

[ssh_connection]
pipelining = True
