---
# Backend-neutral baseline publication.
#
# Copies each host's freshly fetched database and its content snapshots
# (aide_content_snapshot_paths) into the staging directory, writes
# metadata.yml (timestamp, job, user, sha256s, change ref), then hands off to
# playbooks/tasks/backends/<backend>/push.yml to persist it.
# Requires baseline_pull.yml to have staged the store first.
#
# Inputs:
#   aide_baseline_push_hosts (list) - inventory hostnames to publish
#   aide_baseline_action     (str)  - "deploy", "deploy-forced" or "rebaseline"
#   aide_change_ref          (str)  - recorded when set

- name: Baseline push | Hash the rendered AIDE configuration on each host
  ansible.builtin.stat:
    path: /etc/aide.conf
    get_checksum: true
    checksum_algorithm: sha256
  register: __aide_fim_conf_stat
  when: inventory_hostname in aide_baseline_push_hosts

- name: Baseline push | Capture content snapshots on each host
  when:
    - inventory_hostname in aide_baseline_push_hosts
    - aide_content_snapshot_paths_merged | length > 0
  vars:
    __eligible: >-
      {{ __aide_fim_snap_stats.results | default([])
         | selectattr('stat.exists') | selectattr('stat.isreg')
         | selectattr('stat.size', 'le', aide_content_snapshot_max_bytes | int) | list }}
  block:
    - name: Baseline push | Inspect the files to snapshot
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: true
        checksum_algorithm: sha256
      loop: "{{ aide_content_snapshot_paths_merged }}"
      register: __aide_fim_snap_stats

    - name: Baseline push | Fetch the files to snapshot
      ansible.builtin.fetch:
        src: "{{ item.item }}"
        dest: "{{ __aide_fim_fetch_dir }}/snapshots/{{ inventory_hostname }}{{ item.item }}"
        flat: true
      loop: "{{ __eligible }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Baseline push | Record the snapshot checksums
      ansible.builtin.set_fact:
        __aide_fim_snapshots: "{{ dict(__eligible | map(attribute='item') | zip(__eligible | map(attribute='stat.checksum'))) }}"

    - name: Baseline push | Report files that were not snapshotted
      ansible.builtin.debug:
        msg: >-
          Not snapshotted (missing, not a regular file, or larger than
          aide_content_snapshot_max_bytes={{ aide_content_snapshot_max_bytes }}):
          {{ aide_content_snapshot_paths_merged | difference(__aide_fim_snapshots.keys() | list) | join(', ') }}
      when: aide_content_snapshot_paths_merged | difference(__aide_fim_snapshots.keys() | list) | length > 0

- name: Baseline push | Publish baselines
  when: aide_baseline_push_hosts | length > 0
  delegate_to: localhost
  become: false
  run_once: true
  block:
    - name: Baseline push | Create per-host baseline directories
      ansible.builtin.file:
        path: "{{ __aide_fim_stage_dir }}/{{ aide_baseline_path_prefix }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ aide_baseline_push_hosts }}"

    - name: Baseline push | Copy fetched databases into the baseline store
      ansible.builtin.copy:
        src: "{{ __aide_fim_fetch_dir }}/{{ item }}{{ aide_db_dir }}/aide.db.new.gz"
        dest: "{{ __aide_fim_stage_dir }}/{{ aide_baseline_path_prefix }}/{{ item }}/aide.db.gz"
        mode: "0644"
      loop: "{{ aide_baseline_push_hosts }}"

    - name: Baseline push | Remove the previous content snapshots
      ansible.builtin.file:
        path: "{{ __aide_fim_stage_dir }}/{{ aide_baseline_path_prefix }}/{{ item }}/snapshots"
        state: absent
      loop: "{{ aide_baseline_push_hosts }}"

    - name: Baseline push | Copy the new content snapshots into the baseline store
      ansible.builtin.copy:
        src: "{{ __aide_fim_fetch_dir }}/snapshots/{{ item }}/"
        dest: "{{ __aide_fim_stage_dir }}/{{ aide_baseline_path_prefix }}/{{ item }}/snapshots/"
        mode: "0644"
        directory_mode: "0755"
      loop: "{{ aide_baseline_push_hosts }}"
      when: hostvars[item].__aide_fim_snapshots | default({}) | length > 0

    - name: Baseline push | Hash the new baselines
      ansible.builtin.stat:
        path: "{{ __aide_fim_stage_dir }}/{{ aide_baseline_path_prefix }}/{{ item }}/aide.db.gz"
        get_checksum: true
        checksum_algorithm: sha256
      register: __aide_fim_push_db_stats
      loop: "{{ aide_baseline_push_hosts }}"

    - name: Baseline push | Write metadata.yml for each host
      ansible.builtin.copy:
        dest: "{{ __aide_fim_stage_dir }}/{{ aide_baseline_path_prefix }}/{{ __host }}/metadata.yml"
        mode: "0644"
        content: |
          # Generated by file_integrity ({{ aide_baseline_action }}). Do not edit.
          {{ __metadata | to_nice_yaml(indent=2, sort_keys=false) }}
      loop: "{{ __aide_fim_push_db_stats.results }}"
      loop_control:
        label: "{{ __host }}"
      vars:
        __host: "{{ item.item }}"
        __hv: "{{ hostvars[__host] }}"
        __metadata:
          hostname: "{{ __host }}"
          action: "{{ aide_baseline_action }}"
          change_ref: "{{ aide_change_ref | default('', true) }}"
          timestamp: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          aap_job_id: "{{ aide_job_id | string }}"
          launched_by: "{{ aide_launched_by | trim }}"
          sha256: "{{ item.stat.checksum }}"
          size_bytes: "{{ item.stat.size }}"
          aide_version: "{{ __hv.aide_version | default('unknown') }}"
          os: "{{ __hv.ansible_facts.distribution | default('') }} {{ __hv.ansible_facts.distribution_version | default('') }}"
          aide_conf_sha256: "{{ __hv.__aide_fim_conf_stat.stat.checksum | default('') }}"
          # Content snapshots: {path: sha256}, stored under snapshots/<path>.
          snapshots: "{{ __hv.__aide_fim_snapshots | default({}) }}"
          changes_accepted:
            added: "{{ __hv.aide_report.added | default(0) }}"
            removed: "{{ __hv.aide_report.removed | default(0) }}"
            changed: "{{ __hv.aide_report.changed | default(0) }}"

    - name: Baseline push | Persist the baselines with the backend
      ansible.builtin.include_tasks: "backends/{{ aide_baseline_backend }}/push.yml"
      vars:
        __aide_fim_commit_subject: >-
          {{ aide_baseline_action }}: {{ __hosts_short }} by {{ aide_launched_by | trim }}
          (job {{ aide_job_id }}){{ (' [' ~ aide_change_ref ~ ']') if aide_change_ref | default('', true) | length > 0 else '' }}
        __aide_fim_commit_body: |-
          Action:      {{ aide_baseline_action }}
          Change ref:  {{ aide_change_ref | default('n/a', true) }}
          Launched by: {{ aide_launched_by | trim }}
          AAP job:     {{ aide_job_id }}
          Hosts:
          {% for h in aide_baseline_push_hosts %}
            - {{ h }}
          {% endfor %}
        __hosts_short: >-
          {{ (aide_baseline_push_hosts[:5] | join(', '))
             ~ ((' (+' ~ (aide_baseline_push_hosts | length - 5) ~ ' more)') if aide_baseline_push_hosts | length > 5 else '') }}
