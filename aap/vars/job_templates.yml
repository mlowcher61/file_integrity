---
# Four AIDE job templates (ee-supported-rhel9, Machine credential + baseline
# Git token credential) and the "AIDE - Configure AAP" job template that runs
# this configuration as code from inside AAP.
controller_templates:
  - name: AIDE - Deploy
    description: Install AIDE, render aide.conf, create and publish the initial baseline (idempotent).
    organization: "{{ aap_fim_organization }}"
    labels:
      - "{{ aap_fim_label }}"
    project: "{{ aap_fim_project_name }}"
    playbook: playbooks/aide_deploy.yml
    inventory: "{{ aap_fim_inventory }}"
    execution_environment: "{{ aap_fim_execution_environment }}"
    credentials:
      - "{{ aap_fim_machine_credential }}"
      - "{{ aap_fim_baseline_credential }}"
    ask_limit_on_launch: true
    ask_variables_on_launch: true
    allow_simultaneous: false
    extra_vars:
      aide_target_hosts: "{{ aap_fim_target_hosts }}"
      aide_baseline_repo_url: "{{ aap_fim_baseline_repo_url }}"
      aide_baseline_repo_branch: "{{ aap_fim_baseline_repo_branch }}"
      aide_force_init: false

  - name: AIDE - Check
    description: Restore the off-host baseline, run aide --check and report. Never changes the baseline.
    organization: "{{ aap_fim_organization }}"
    labels:
      - "{{ aap_fim_label }}"
    project: "{{ aap_fim_project_name }}"
    playbook: playbooks/aide_check.yml
    inventory: "{{ aap_fim_inventory }}"
    execution_environment: "{{ aap_fim_execution_environment }}"
    credentials:
      - "{{ aap_fim_machine_credential }}"
      - "{{ aap_fim_baseline_credential }}"
    ask_limit_on_launch: true
    # Required so the "AIDE - Daily Check" schedule can carry the label
    # (AAP treats schedule labels as a launch prompt).
    ask_labels_on_launch: true
    allow_simultaneous: false
    extra_vars:
      aide_target_hosts: "{{ aap_fim_target_hosts }}"
      aide_baseline_repo_url: "{{ aap_fim_baseline_repo_url }}"
      aide_baseline_repo_branch: "{{ aap_fim_baseline_repo_branch }}"

  - name: AIDE - Rebaseline
    description: Accept the current state as the new baseline after an APPROVED change. Requires a change reference.
    organization: "{{ aap_fim_organization }}"
    labels:
      - "{{ aap_fim_label }}"
    project: "{{ aap_fim_project_name }}"
    playbook: playbooks/aide_rebaseline.yml
    inventory: "{{ aap_fim_inventory }}"
    execution_environment: "{{ aap_fim_execution_environment }}"
    credentials:
      - "{{ aap_fim_machine_credential }}"
      - "{{ aap_fim_baseline_credential }}"
    ask_limit_on_launch: true
    allow_simultaneous: false
    extra_vars:
      aide_baseline_repo_url: "{{ aap_fim_baseline_repo_url }}"
      aide_baseline_repo_branch: "{{ aap_fim_baseline_repo_branch }}"
    survey_enabled: true
    survey_spec:
      name: AIDE re-baseline
      description: Approved change details
      spec:
        - question_name: Change reference
          question_description: >-
            Approved change number (for example CHG0012345). Recorded in the
            baseline metadata and the commit message.
          required: true
          type: text
          variable: aide_change_ref
          min: 3
          max: 64
          default: ""
        - question_name: Target hosts
          question_description: >-
            Inventory group or host pattern to re-baseline. Use the Limit
            prompt to narrow this further (for example a single host).
          required: true
          type: text
          variable: aide_target_hosts
          min: 1
          max: 1024
          default: "{{ aap_fim_target_hosts }}"

  - name: AIDE - Validate Config
    description: Render aide.conf to a temp file and run aide --config-check. Makes no changes.
    organization: "{{ aap_fim_organization }}"
    labels:
      - "{{ aap_fim_label }}"
    project: "{{ aap_fim_project_name }}"
    playbook: playbooks/aide_config_validate.yml
    inventory: "{{ aap_fim_inventory }}"
    execution_environment: "{{ aap_fim_execution_environment }}"
    credentials:
      - "{{ aap_fim_machine_credential }}"
      - "{{ aap_fim_baseline_credential }}"
    ask_limit_on_launch: true
    allow_simultaneous: false
    extra_vars:
      aide_target_hosts: "{{ aap_fim_target_hosts }}"

  # Config-as-code job template. You create it by hand once (aap/README.md,
  # step 4); every run of configure_aap.yml then keeps it in line with this
  # definition, so its extra variables and survey are managed as code too.
  - name: "{{ aap_fim_config_job_template }}"
    description: Apply the file_integrity AAP configuration as code (aap/configure_aap.yml).
    organization: "{{ aap_fim_organization }}"
    labels:
      - "{{ aap_fim_label }}"
    project: "{{ aap_fim_project_name }}"
    playbook: aap/configure_aap.yml
    inventory: "{{ aap_fim_config_inventory }}"
    execution_environment: "{{ aap_fim_execution_environment }}"
    credentials:
      - "{{ aap_fim_aap_credential }}"
    allow_simultaneous: false
    # Every site setting is written back, so values entered as extra
    # variables in the UI survive this job managing its own template.
    extra_vars:
      aap_fim_organization: "{{ aap_fim_organization }}"
      aap_fim_inventory: "{{ aap_fim_inventory }}"
      aap_fim_machine_credential: "{{ aap_fim_machine_credential }}"
      aap_fim_aap_credential: "{{ aap_fim_aap_credential }}"
      aap_fim_label: "{{ aap_fim_label }}"
      aap_fim_target_hosts: "{{ aap_fim_target_hosts }}"
      aap_fim_project_url: "{{ aap_fim_project_url }}"
      aap_fim_project_branch: "{{ aap_fim_project_branch }}"
      aap_fim_baseline_repo_url: "{{ aap_fim_baseline_repo_url }}"
      aap_fim_baseline_repo_branch: "{{ aap_fim_baseline_repo_branch }}"
      aap_fim_execution_environment: "{{ aap_fim_execution_environment }}"
      aap_fim_create_execution_environment: "{{ aap_fim_create_execution_environment }}"
      aap_fim_execution_environment_image: "{{ aap_fim_execution_environment_image }}"
      aap_fim_execution_environment_registry_credential: "{{ aap_fim_execution_environment_registry_credential }}"
      aap_fim_config_inventory: "{{ aap_fim_config_inventory }}"
      aap_fim_schedule_timezone: "{{ aap_fim_schedule_timezone }}"
      aap_fim_schedule_start: "{{ aap_fim_schedule_start }}"
      aap_fim_approval_timeout: "{{ aap_fim_approval_timeout }}"
    survey_enabled: true
    survey_spec:
      name: AIDE - Configure AAP
      description: Secrets for the file_integrity configuration
      spec:
        - question_name: Baseline repository token
          question_description: >-
            Read/write token for the baseline repository. Required on the
            first run and to rotate the token; leave blank to keep the
            existing token.
          required: false
          type: password
          variable: aap_fim_baseline_token
          min: 0
          max: 1024
          default: ""
