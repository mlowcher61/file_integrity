---
controller_credential_types:
  - name: AIDE Baseline Git Token
    description: >-
      Access token (read/write) for the private Git repository that stores the
      known-good AIDE baselines. Injected as AIDE_BASELINE_GIT_TOKEN.
    kind: cloud
    inputs:
      fields:
        - id: token
          type: string
          label: Git access token
          secret: true
          help_text: >-
            GitHub fine-grained token (Contents: read and write) or GitLab
            project access token (write_repository) for the baseline repository.
      required:
        - token
    injectors:
      env:
        AIDE_BASELINE_GIT_TOKEN: !unsafe "{{ token }}"
