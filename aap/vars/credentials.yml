---
# The baseline repository token is supplied through the encrypted survey
# question "Baseline repository token" on the "AIDE - Configure AAP" job
# template (variable aap_fim_baseline_token).
#
#  * Token entered  -> the credential is created, or its token is replaced
#                      (use this to rotate the token).
#  * Survey blank   -> the credential is left exactly as it is in AAP. It
#                      must already exist (i.e. enter the token on the first run).
#
# The Machine and AAP credentials (aap_fim_machine_credential,
# aap_fim_aap_credential) must already exist; they are referenced by name only.
controller_credentials: >-
  {{ [{
        'name': aap_fim_baseline_credential,
        'description': 'Token for ' ~ aap_fim_baseline_repo_url,
        'credential_type': 'AIDE Baseline Git Token',
        'organization': aap_fim_organization,
        'inputs': {'token': aap_fim_baseline_token},
        'update_secrets': true
      }] if (aap_fim_baseline_token | default('', true) | length > 0) else [] }}
