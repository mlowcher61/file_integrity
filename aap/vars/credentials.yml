---
# References only. The secret value comes from the AIDE_BASELINE_GIT_TOKEN
# environment variable of whoever runs configure_aap.yml.
#
# update_secrets: false means re-running configure_aap.yml will NOT overwrite
# a token that already exists in AAP (rotate it in the AAP UI, or set this to
# true for one run).
#
# The Machine credential (aap_fim_machine_credential) must already exist.
controller_credentials:
  - name: "{{ aap_fim_baseline_credential }}"
    description: Token for {{ aap_fim_baseline_repo_url }}
    credential_type: AIDE Baseline Git Token
    organization: "{{ aap_fim_organization }}"
    inputs:
      token: "{{ lookup('ansible.builtin.env', 'AIDE_BASELINE_GIT_TOKEN') }}"
    update_secrets: false
