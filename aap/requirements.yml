---
# Collections needed ONLY to run aap/configure_aap.yml (configuring the
# controller). The AIDE playbooks themselves do not need these.
#   ansible-galaxy collection install -r aap/requirements.yml -p aap/collections
collections:
  # Validated content: config-as-code roles for AAP 2.5+.
  - name: infra.aap_configuration
  # Certified: platform gateway modules (organizations, users, auth).
  - name: ansible.platform
  # Certified: automation controller modules (credential types, projects,
  # job templates, workflows, schedules). infra.aap_configuration uses these
  # for controller objects because ansible.platform does not manage them.
  - name: ansible.controller
