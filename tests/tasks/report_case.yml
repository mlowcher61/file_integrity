---
- name: "Case | Parse {{ case.fixture }}"
  ansible.builtin.include_tasks: ../../playbooks/tasks/report.yml
  vars:
    aide_report_max_paths: "{{ case.max_paths }}"
    aide_report_stats_key: aide_test_results
    aide_report_result:
      rc: "{{ case.rc }}"
      stdout: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/fixtures/' ~ case.fixture) if case.rc != 17 else '' }}"
      stderr: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/fixtures/' ~ case.fixture) if case.rc == 17 else '' }}"

- name: "Case | Check the parsed report for {{ case.fixture }}"
  ansible.builtin.assert:
    that:
      - aide_report.status == case.expect.status
      - aide_report.added | int == case.expect.added
      - aide_report.removed | int == case.expect.removed
      - aide_report.changed | int == case.expect.changed
      - aide_report.total_entries | int == case.expect.total
      - aide_report.added_paths == case.expect_paths.added
      - aide_report.removed_paths == case.expect_paths.removed
      - aide_report.changed_paths == case.expect_paths.changed
      - (aide_report.paths_truncated | bool) == (aide_report.paths_total | int > case.max_paths | int)
      - (case.expect.status != 'error') or (aide_report.error | length > 0)
    fail_msg: "Unexpected report for {{ case.fixture }}: {{ aide_report }}"
    quiet: true

- name: "Case | Check which attributes changed per path for {{ case.fixture }}"
  ansible.builtin.assert:
    that:
      - aide_report.changed_details | dict2items | map(attribute='key') | sort | list
        == case.expect_details | dict2items | map(attribute='key') | sort | list
      - case.expect_details | dict2items | map(attribute='key') | map('extract', aide_report.changed_details)
        | map('map', attribute='attribute') | map('list') | list
        == case.expect_details | dict2items | map(attribute='value') | list
    fail_msg: "Unexpected change details for {{ case.fixture }}: {{ aide_report.changed_details }}"
    quiet: true
  when: case.expect_details is defined

- name: "Case | Check old and new values for {{ case.fixture }}"
  ansible.builtin.assert:
    that:
      - __change.old == item.old
      - __change.new == item.new
    fail_msg: "{{ item.path }} {{ item.attribute }}: expected {{ item.old }} -> {{ item.new }}, got {{ __change }}"
    quiet: true
  vars:
    __change: >-
      {{ aide_report.changed_details[item.path] | default([])
         | selectattr('attribute', 'equalto', item.attribute) | first | default({}) }}
  loop: "{{ case.expect_values | default([]) }}"
  loop_control:
    label: "{{ item.path }} {{ item.attribute }}"
